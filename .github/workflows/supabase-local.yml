name: Supabase local migrations

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local.yml"
      - "tests/billing-concurrency.test.mjs"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local.yml"
      - "tests/billing-concurrency.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    name: Apply migrations and SQL tests to an isolated Supabase stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Supabase CLI v2
        uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Report Supabase CLI version
        run: supabase --version

      - name: Start isolated Supabase and apply migrations
        run: supabase start

      - name: Verify applied migration history
        run: supabase migration list --local

      - name: Run database tests
        run: supabase test db

      - name: Verify concurrent billing writes
        run: node tests/billing-concurrency.test.mjs
