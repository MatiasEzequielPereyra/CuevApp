name: Verify foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Verify PDF validator runtime asset
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const trace = JSON.parse(readFileSync(".next/server/app/api/comprobantes/route.js.nft.json", "utf8"));
            assert.ok(trace.files.some(file => file.endsWith("/node_modules/pdf-lib/dist/pdf-lib.min.js")));
          '
      - run: npm run verify:security
      - run: npm audit --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: |
            evidence/runs/
            test-results/
