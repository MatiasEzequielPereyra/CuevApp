name: Verify foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Regenerate lockfile with scoped security override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Show lockfile security update
        run: git diff -- package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm run verify:security
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Report complete dependency audit
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities,packages:Object.entries(a.vulnerabilities??{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range,url:x.url})}))},null,2))'
      - run: npm audit --audit-level=moderate
      - run: npm audit --audit-level=critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-evidence
          path: |
            evidence/runs/
            test-results/
