name: CUEVA-006E isolated checks

on:
  push:
    branches:
      - feature/cueva-006e-exercise-mention-preview
    paths:
      - "src/components/routines/exercise-mention.tsx"
      - "src/lib/routines/mention-video-availability.ts"
      - "src/lib/routines/mentions.ts"
      - "tests/routine-mentions.test.mjs"
      - ".github/workflows/cueva-006e.yml"
  pull_request:
    paths:
      - "src/components/routines/exercise-mention.tsx"
      - "src/lib/routines/mention-video-availability.ts"
      - "src/lib/routines/mentions.ts"
      - "tests/routine-mentions.test.mjs"
      - ".github/workflows/cueva-006e.yml"

permissions:
  contents: read

jobs:
  mentions:
    name: Routine mentions unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Test routine mention validation and video availability
        run: npm run test:routines:mentions
