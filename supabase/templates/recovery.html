<h2>Recuperá tu acceso a CUEVA</h2>
{{ if eq .RedirectTo (print .SiteURL "/recuperar-contrasena") }}
<p><a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery">Elegir contraseña</a></p>
{{ else }}
<p><a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}">Elegir contraseña</a></p>
{{ end }}
